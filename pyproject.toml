[project]
name = "api-deprecation-gateway-python"
version = "0.1.0"
requires-python = ">=3.14.4"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "pytest>=8.0",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.pytest.ini_options]
# Make the in-repo `gateway` package importable so `pytest` works from the
# repository root without manual PYTHONPATH tweaks.
pythonpath = ["."]
testpaths = ["tests"]
